
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Food Ordering System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8ef;
      color: #333;
      margin: 0;
      padding: 25px;
    }

    h1, h2 {
      color: #9b3f17;
    }

    h1 {
      text-align: center;
    }

    section {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    input, select, button {
      padding: 10px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    button {
      background: #a84316;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #7d3010;
    }

    li {
      margin: 12px 0;
      line-height: 1.8;
    }

    .message {
      font-weight: bold;
      margin: 10px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      input, select {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <h1>🍔 Online Food Ordering System</h1>

  <!-- Food menu CRUD -->
  <section>
    <h2>Manage Food Menu</h2>

    <input type="text" id="name" placeholder="Food name">
    <input type="number" id="price" placeholder="Price" min="1">

    <button onclick="saveFood()">Add Food</button>
    <button onclick="clearForm()">Clear</button>

    <p id="foodMessage" class="message"></p>
    <ul id="menu"></ul>
  </section>

  <!-- Customer ordering -->
  <section>
    <h2>Place Customer Order</h2>

    <input type="text" id="customer" placeholder="Customer name">

    <select id="food">
      <option value="">Select food</option>
    </select>

    <input type="number" id="qty" min="1" value="1"
           placeholder="Quantity">

    <button onclick="placeOrder()">Place Order</button>

    <p id="orderMessage" class="message"></p>
  </section>

  <!-- Order management -->
  <section>
    <h2>Customer Orders</h2>

    <button onclick="loadOrders()">Refresh Orders</button>
    <p id="ordersMessage" class="message"></p>
    <ul id="orders"></ul>
  </section>

  <script>
    let foods = [];
    let editingId = null;

    // Send requests to the Express backend
    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(
          "Invalid server response. Check the API route in server.js."
        );
      }

      if (!response.ok) {
        throw new Error(data.error || "Request failed");
      }

      return data;
    }

    function showMessage(id, message, isError = false) {
      const element = document.getElementById(id);
      element.textContent = message;
      element.className = "message " +
        (isError ? "error" : "success");
    }

    // Display all food items and populate the order dropdown
    async function loadFoods() {
      try {
        foods = await request("/api/foods");

        const menu = document.getElementById("menu");
        const foodSelect = document.getElementById("food");

        menu.replaceChildren();
        foodSelect.replaceChildren();

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select food";
        foodSelect.appendChild(placeholder);

        foods.forEach(food => {
          const li = document.createElement("li");
          li.appendChild(document.createTextNode(
            `${food.name} - ₹${food.price} `
          ));

          const editButton = document.createElement("button");
          editButton.textContent = "Edit";
          editButton.onclick = () => editFood(food.id);

          const deleteButton = document.createElement("button");
          deleteButton.textContent = "Delete";
          deleteButton.onclick = () => deleteFood(food.id);

          li.append(editButton, deleteButton);
          menu.appendChild(li);

          const option = document.createElement("option");
          option.value = food.id;
          option.textContent = `${food.name} - ₹${food.price}`;
          foodSelect.appendChild(option);
        });

        if (editingId !== null &&
            !foods.some(f => f.id === editingId)) {
          clearForm();
        }
      } catch (error) {
        showMessage("foodMessage", error.message, true);
      }
    }

    // Add a new dish or update an existing dish
    async function saveFood() {
      try {
        const name = document.getElementById("name").value.trim();
        const price = Number(document.getElementById("price").value);

        if (!name || !Number.isFinite(price) || price <= 0) {
          showMessage("foodMessage",
            "Enter a valid food name and price.", true);
          return;
        }

        const url = editingId !== null
          ? `/api/foods/${editingId}`
          : "/api/foods";

        const method = editingId !== null ? "PUT" : "POST";

        await request(url, {
          method,
          body: JSON.stringify({ name, price })
        });

        clearForm();
        await loadFoods();

        showMessage("foodMessage",
          "Food saved successfully.");
      } catch (error) {
        showMessage("foodMessage", error.message, true);
      }
    }

    // Load a dish into the form for editing
    function editFood(id) {
      const food = foods.find(f => f.id === id);
      if (!food) return;

      editingId = id;
      document.getElementById("name").value = food.name;
      document.getElementById("price").value = food.price;

      const button = document.querySelector(
        "#menu"
      );

      showMessage("foodMessage",
        "Edit the details and click Add / Update Food.");
      document.querySelector(
        'button[onclick="saveFood()"]'
      ).textContent = "Update Food";
    }

    // Delete a dish
    async function deleteFood(id) {
      if (!confirm("Do you want to delete this food item?")) {
        return;
      }

      try {
        await request(`/api/foods/${id}`, {
          method: "DELETE"
        });

        if (editingId === id) clearForm();

        await loadFoods();
        showMessage("foodMessage",
          "Food deleted successfully.");
      } catch (error) {
        showMessage("foodMessage", error.message, true);
      }
    }

    // Reset the food form
    function clearForm() {
      editingId = null;
      document.getElementById("name").value = "";
      document.getElementById("price").value = "";
      document.querySelector(
        'button[onclick="saveFood()"]'
      ).textContent = "Add Food";
    }

    // Place a customer order using the backend's expected fields
    async function placeOrder() {
      try {
        const customer =
          document.getElementById("customer").value.trim();

        const foodId =
          Number(document.getElementById("food").value);

        const quantity =
          Number(document.getElementById("qty").value);

        const selectedFood = foods.find(f => f.id === foodId);

        if (!customer) {
          showMessage("orderMessage",
            "Enter the customer name.", true);
          return;
        }

        if (!selectedFood) {
          showMessage("orderMessage",
            "Please select a food item.", true);
          return;
        }

        if (!Number.isInteger(quantity) || quantity < 1) {
          showMessage("orderMessage",
            "Enter a valid quantity.", true);
          return;
        }

        // The current server.js expects customer and food
        await request("/api/orders", {
          method: "POST",
          body: JSON.stringify({
            customer: customer,
            food: selectedFood.name,
            quantity: quantity
          })
        });

        showMessage("orderMessage",
          "Order placed successfully!");

        document.getElementById("customer").value = "";
        document.getElementById("qty").value = "1";

        await loadOrders();
      } catch (error) {
        showMessage("orderMessage", error.message, true);
      }
    }

    // Display customer orders
    async function loadOrders() {
      try {
        const orders = await request("/api/orders");
        const list = document.getElementById("orders");

        list.replaceChildren();

        if (orders.length === 0) {
          const li = document.createElement("li");
          li.textContent = "No orders placed yet.";
          list.appendChild(li);
        }

        orders.forEach(order => {
          const li = document.createElement("li");

          li.textContent =
            `${order.customer}: ${order.food} × ${order.quantity} ` +
            `| Status: ${order.status} `;

          const statusSelect = document.createElement("select");

          ["Pending", "Preparing", "Delivered", "Cancelled"]
            .forEach(status => {
              const option = document.createElement("option");
              option.value = status;
              option.textContent = status;
              option.selected = status === order.status;
              statusSelect.appendChild(option);
            });

          statusSelect.onchange = () =>
            updateStatus(order.id, statusSelect.value);

          li.appendChild(statusSelect);
          list.appendChild(li);
        });

        showMessage("ordersMessage", "Orders loaded.");
      } catch (error) {
        showMessage("ordersMessage", error.message, true);
      }
    }

    // Update an order's status
    async function updateStatus(id, status) {
      try {
        await request(`/api/orders/${id}`, {
          method: "PUT",
          body: JSON.stringify({ status })
        });

        await loadOrders();
      } catch (error) {
        showMessage("ordersMessage", error.message, true);
      }
    }

    // Load initial data
    loadFoods();
    loadOrders();
  </script>

</body>
</html>
